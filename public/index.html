<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Banderas de Playa — Santander</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="header">
      <div class="header-content">
        <h1>🏖️ Banderas de Playa</h1>
        <p>Santander, en directo — Cruz Roja Española</p>
      </div>
      <svg class="header-wave" viewBox="0 0 1200 60" preserveAspectRatio="none" aria-hidden="true">
        <path
          d="M0,20 C150,45 300,0 450,15 C600,30 750,50 900,25 C1020,5 1120,20 1200,10 L1200,60 L0,60 Z"
        />
      </svg>
    </header>
    <div id="map"></div>
    <div id="legend">
      <div class="legend-item"><span class="dot" style="background:#2ecc71"></span>Verde — apta para el baño</div>
      <div class="legend-item"><span class="dot" style="background:#f1c40f"></span>Amarilla — precaución</div>
      <div class="legend-item"><span class="dot" style="background:#e74c3c"></span>Roja — baño no permitido</div>
      <a
        class="source-link"
        href="https://www.cruzroja.es/appjv/consPlayas/listaPlayas.do?autonomia=Cantabria&autonomia_id=6&provincia=CANTABRIA&provincia_id=39&municipio=SANTANDER&municipio_id=75&playa=&action=noadaptadas"
        target="_blank"
        rel="noopener"
        >Fuente: Cruz Roja Española</a
      >
    </div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js" defer></script>
  </body>
</html>
